# Default-deny egress allowlist for the agent sandbox.
#
# The agent's network is `internal: true`, so this proxy is the only route to
# the internet that exists. If a host is not in allowlist.txt, the packet has
# nowhere to go — this is a routing fact, not a policy the agent can argue with.

http_port 3128
visible_hostname agent-egress-proxy

# The container starts as the `squid` user (see proxy/Dockerfile and the
# `user:` key in docker-compose.yml), so there is no privilege drop to do.
# These two lines are a harmless no-op in that case; they matter only if you
# run this image as root somewhere else.
cache_effective_user squid
cache_effective_group squid

# Running unprivileged, squid cannot write the default /var/run/squid.pid.
# Point it somewhere the squid user owns.
pid_filename /var/cache/squid/squid.pid

# --- ACLs -------------------------------------------------------------------
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Self-hosted GitLab/Gitea on a non-standard SSH port: uncomment and set the
# port to let the agent CONNECT-tunnel ssh to it. Every port you open here is
# another channel out — only add one if the agent genuinely pushes over SSH.
# acl SSH_ports port 2222
# acl Safe_ports port 2222

# One host per line. A leading dot matches the domain *and* its subdomains.
acl allowed_domains dstdomain "/etc/squid/allowlist.txt"

# --- Access rules — first match wins, order matters -------------------------
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# ...and if you enabled SSH_ports above, replace the line above with:
# http_access deny CONNECT !SSL_ports !SSH_ports
http_access allow allowed_domains
http_access deny all

# For HTTPS the agent issues CONNECT host:443, and we match on that hostname.
# No TLS interception, so no CA to install in the container and no plaintext
# copy of the agent's traffic sitting anywhere. The tradeoff: we control *who*
# it talks to, not *what* it says. See "What this does not protect against".

# --- No caching. This is a policy gate, not a cache. ------------------------
cache deny all
cache_mem 0 MB

# --- Logging ----------------------------------------------------------------
# Every request the agent makes, allowed or denied, lands in `docker compose
# logs egress-proxy` on the host — outside the sandbox, and therefore not
# something the agent can rewrite after the fact.
logfile_rotate 0
access_log stdio:/dev/stdout squid
cache_log /dev/stderr

# --- Don't leak sandbox internals upstream ----------------------------------
forwarded_for delete
via off
httpd_suppress_version_string on

# Fail fast rather than hanging a build for two minutes on a blocked host.
connect_timeout 15 seconds
