# services/redis/service.conf — Redis 7 as a sibling service.
# Started by you with `./sandbox run ... --service redis:7`, never by the
# agent. Format and keys: services/README.md. Parsed with `read`, never
# sourced. Each line below is justified by the comment above it.

# The official image, Alpine variant: small, and it runs as a fixed non-root
# user. Ships UNPINNED; scripts/pin-images.sh pulls the tag named here and
# writes the digest, and ./sandbox refuses the service until it has.
# tag: docker.io/library/redis:7-alpine
IMAGE=UNPINNED

# What `--service redis:<version>` accepts. One image is pinned above, so one
# version.
VERSIONS=7

# The `redis` user and group of the Alpine image. The official start script
# notices it is not root and skips its switch-user step, which would need
# capabilities this container does not have [physical B02].
USER=999:1000

# No TMPFS lines: with the command below Redis keeps everything in its own
# memory and writes no file, so it needs no writable path at all on its
# read-only root filesystem [physical B07].

# The command, one argument per line, in order. Stated in full because the
# image's default would write snapshots to disk.
COMMAND_ARG=redis-server
# `--save ""`: no snapshot files. The next line is an EMPTY argument (nothing
# after the `=`); whatever reads this file must keep it.
COMMAND_ARG=--save
COMMAND_ARG=
# No append-only log file either.
COMMAND_ARG=--appendonly
COMMAND_ARG=no
# Redis's own ceiling on stored data. Past it, writes get an error; without
# it the data would grow until the kernel killed the container at MEMORY.
COMMAND_ARG=--maxmemory
COMMAND_ARG=384mb

# 384 MB of data plus Redis's own overhead and the 64 MB of shared memory
# topology.sh gives every service [physical B10].
MEMORY=512m

# One process and a handful of threads [physical B10].
PIDS=64

# Where it listens; used for the URL below and the health check.
PORT=6379

# The environment variable handed to the agent's CLI, and its value. {host}
# is replaced by the service's address on the session network. No password: the
# service is reachable only from this session's internal network, and the
# agent would be handed the password anyway.
URL_VAR=REDIS_URL
URL_TEMPLATE=redis://{host}:6379/0

# Run with `podman exec` until it succeeds: exits 0 once the server answers.
HEALTH=redis-cli -h 127.0.0.1 -p 6379 ping
