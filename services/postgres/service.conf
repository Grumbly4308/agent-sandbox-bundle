# services/postgres/service.conf — PostgreSQL 16 as a sibling service.
# Started by you with `./sandbox run ... --service postgres:16`, never by the
# agent. Format and keys: services/README.md. Parsed with `read`, never
# sourced. Each line below is justified by the comment above it.

# The official image, Alpine variant: small, and it runs as a fixed non-root
# user. Ships UNPINNED; scripts/pin-images.sh pulls the tag named here and
# writes the digest, and ./sandbox refuses the service until it has.
# tag: docker.io/library/postgres:16-alpine
IMAGE=UNPINNED

# What `--service postgres:<version>` accepts. One image is pinned above, so
# one version.
VERSIONS=16

# The `postgres` user of the Alpine image. The official start script notices
# it is not root and skips its chown-and-switch-user step, which would need
# capabilities this container does not have [physical B02].
USER=70:70

# The database files, in memory, capped at 512 MB, never on your disk and
# gone with the session [physical B08]. mode=1777 because the mount starts
# out owned by root and user 70 has to create its directory inside it.
TMPFS=/var/lib/postgresql/data:size=512m,mode=1777,nosuid,nodev,noexec

# Where Postgres puts its socket and lock file. The root filesystem is
# read-only [physical B07], so this small path has to be a memory mount too.
TMPFS=/var/run/postgresql:size=1m,mode=1777,nosuid,nodev,noexec

# The data directory proper is a sub-directory of the mount: Postgres insists
# on owning its data directory with mode 0700, and it cannot own or re-mode
# the mount point itself. The start script creates this directory as user 70.
ENV=PGDATA=/var/lib/postgresql/data/pgdata

# The official image refuses to start without a password. This one is not a
# secret: the agent is handed it on purpose (see URL_TEMPLATE), and the
# database is reachable only from this session's internal network.
ENV=POSTGRES_PASSWORD=sandbox

# 512 MB of data files (they are memory, so they count), 64 MB of shared
# memory (topology.sh), and the rest for the server's own buffers and
# connections [physical B10].
MEMORY=1g

# Postgres runs one process per connection: 100 connections by default, plus
# about ten background processes [physical B10].
PIDS=256

# Where it listens; used for the URL below and the health check.
PORT=5432

# The environment variable handed to the agent's CLI, and its value. {host}
# is replaced by the service's name on the session network.
URL_VAR=DATABASE_URL
URL_TEMPLATE=postgres://postgres:sandbox@{host}:5432/postgres

# Run with `podman exec` until it succeeds. Over TCP on purpose: on first
# start the official script runs a temporary server that listens only on the
# local socket, stops it, and then starts the real one. A check on the socket
# would say "ready" during the temporary one; TCP answers only on the real one.
HEALTH=pg_isready -h 127.0.0.1 -p 5432 -U postgres
