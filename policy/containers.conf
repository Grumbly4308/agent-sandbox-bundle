# Podman settings ./sandbox applies to every container it creates, on top of
# your own Podman configuration (through CONTAINERS_CONF_OVERRIDE).
#
# One setting, for barrier B13: by default Podman writes a line into every
# container's /etc/hosts naming your host (host.containers.internal) with one
# of your host's addresses. The agent's network cannot reach that address, but
# it has no business knowing it. "none" leaves the line out.
#
# Unproven until Phase B: that every supported Podman version honours "none".
# `./sandbox verify` reads the agent's /etc/hosts and fails if a host address
# is there.
[containers]
host_containers_internal_ip = "none"
