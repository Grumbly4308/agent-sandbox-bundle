# Podman settings ./sandbox applies to every container it creates, on top of
# your own Podman configuration (through CONTAINERS_CONF_OVERRIDE).
#
# Two settings, for barrier B13. By default Podman writes a line into every
# container's /etc/hosts naming your host (host.containers.internal) with one
# of your host's addresses, and copies in every line of your own /etc/hosts.
# The agent's network cannot reach those addresses, but it has no business
# knowing them. "none" leaves both out.
#
# Unproven until Phase B: that Podman 5.4, the oldest `doctor` accepts,
# honours both. `./sandbox verify` reads the agent's /etc/hosts and fails if
# anything but loopback and the session's own addresses is there.
[containers]
host_containers_internal_ip = "none"
base_hosts_file = "none"
